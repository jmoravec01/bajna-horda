[request]
method = "HEAD"
path = "/"

[response]
status = 200

[response.headers]
cache-control = "no-cache"
content-security-policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' ws: wss:; font-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
content-type = "text/html; charset=utf-8"
x-content-type-options = "nosniff"
