[request]
method = "OPTIONS"
path = "/api/login"

[request.headers]
Access-Control-Request-Method = "POST"
Origin = "https://jmoravec01.github.io"

[response]
status = 204

[response.headers]
access-control-allow-headers = "Content-Type, Authorization"
access-control-allow-methods = "GET, POST, OPTIONS"
access-control-allow-origin = "https://jmoravec01.github.io"
vary = "Origin"
