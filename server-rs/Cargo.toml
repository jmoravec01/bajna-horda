[package]
name = "horde-server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
scrypt = { version = "0.11", default-features = false, features = ["std"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
flate2 = "1"
regex = "1"
unicode-normalization = "0.1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
